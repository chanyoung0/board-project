server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # /api 요청은 백엔드 Service(board-backend:8080)로 전달 → 같은 주소라 CORS 불필요
    location /api/ {
        proxy_pass http://board-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 시연용 H2 콘솔
    location /h2-console {
        proxy_pass http://board-backend:8080;
        proxy_set_header Host $host;
    }
}
