apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-frontend
  namespace: board
spec:
  # 프론트는 상태가 없어서 여러 개 + 무중단(RollingUpdate) 배포 가능
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: board-frontend
  template:
    metadata:
      labels:
        app: board-frontend
    spec:
      containers:
      - name: frontend
        image: chanyoung123/board-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: board-frontend
  namespace: board
spec:
  # MetalLB가 외부 IP 할당 → VirtualBox 포트포워딩으로 접속
  type: LoadBalancer
  selector:
    app: board-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
