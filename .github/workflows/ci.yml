name: Build and Update Manifests

on:
  push:
    branches:
      - main
    # k8s 폴더만 바뀐 커밋(태그 갱신 커밋 등)에는 다시 빌드하지 않음
    paths-ignore:
      - 'k8s/**'
      - '**.md'

permissions:
  contents: write

env:
  DOCKERHUB_USER: chanyoung123

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image tag (commit SHA 7자리)
      run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build backend image
      run: docker image build -t $DOCKERHUB_USER/board-backend:$TAG ./backend

    - name: Build frontend image
      run: docker image build -t $DOCKERHUB_USER/board-frontend:$TAG ./frontend

    - name: Test backend container
      run: |
        docker container run -d --name backend-test -p 8080:8080 $DOCKERHUB_USER/board-backend:$TAG
        sleep 25
        curl -f http://127.0.0.1:8080/api/posts
        docker container rm -f backend-test

    - name: Push images
      run: |
        docker image push $DOCKERHUB_USER/board-backend:$TAG
        docker image push $DOCKERHUB_USER/board-frontend:$TAG

    - name: Update image tags in k8s manifests
      run: |
        sed -i "s|image: $DOCKERHUB_USER/board-backend:.*|image: $DOCKERHUB_USER/board-backend:$TAG|" k8s/backend.yaml
        sed -i "s|image: $DOCKERHUB_USER/board-frontend:.*|image: $DOCKERHUB_USER/board-frontend:$TAG|" k8s/frontend.yaml

    - name: Commit and push manifests
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/
        git commit -m "deploy: update image tag to $TAG"
        git pull --rebase origin main
        git push origin main
