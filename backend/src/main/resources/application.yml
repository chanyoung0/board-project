server:
  port: 8080

spring:
  datasource:
    # H2 파일 모드: 파드가 재시작돼도 /data(hostPath)에 데이터가 남는다
    # 로컬(IntelliJ)에서 돌릴 땐 DB_PATH 환경변수가 없으면 ./data/board 에 저장된다
    url: jdbc:h2:file:${DB_PATH:./data/board};AUTO_SERVER=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # nginx(프론트 파드)를 거쳐 들어오는 요청도 허용
        web-allow-others: true
